services:
  aavail-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      AAVAIL_DATA_DIR: /app/data/cs-train
      AAVAIL_MODEL_DIR: /app/models
      AAVAIL_TRAIN_LOG: /app/logs/train.jsonl
      AAVAIL_PREDICT_LOG: /app/logs/predict.jsonl
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
